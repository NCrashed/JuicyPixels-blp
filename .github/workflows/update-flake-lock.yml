name: Update flake.lock

on:
  schedule:
    - cron: '0 6 * * 1' # Mondays
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - uses: DeterminateSystems/update-flake-lock@v29
        with:
          pr-title: Update flake.lock
          pr-labels: dependencies
